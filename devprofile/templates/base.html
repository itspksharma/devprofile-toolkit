{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Understand public GitHub and GitLab repositories, audit documentation, and build a better README.">
  <title>{% block title %}DevProfile Toolkit{% endblock %}</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('devprofile-theme')||'dark'}catch(e){}</script>
  <link rel="stylesheet" href="{% static 'analyzer/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}" aria-label="DevProfile Toolkit home"><span class="brand-symbol" aria-hidden="true">&lt;/&gt;</span><span>DevProfile<span class="brand-sub">Toolkit</span></span></a>
    <nav aria-label="Main navigation">
      <a href="{% url 'home' %}" {% if request.path == '/' or request.path == '/analyzer/' %}aria-current="page"{% endif %}>Analyzer</a>
      <a href="{% url 'readme_generator' %}" {% if request.path == '/readme/' %}aria-current="page"{% endif %}>README Studio</a>
    </nav>
    <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to light theme">Light theme</button>
  </header>
  <main id="main">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><span>DevProfile Toolkit</span><span>Understand your work. Tell its story.</span><span>GitHub &amp; GitLab</span></footer>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="{% static 'analyzer/app.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
